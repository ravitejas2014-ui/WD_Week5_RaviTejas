<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <header>
        <h1>My To-Do List</h1>
        <button id="darkModeBtn">🌙 Dark Mode</button>
    </header>

    <div class="hero-image">
        <div class="motivation-card">
            <h2>🚀 Keep Going!!</h2>
            <p>Never Give up. Every completed task is one step closer to your goal.</p>
        </div>
    </div>

    <div class="container">

        <input type="text"
               id="taskInput"
               placeholder="Enter a task">

        <button id="addBtn">Add Task</button>

        <h3>
            Total Tasks:
            <span id="taskCount">0</span>
        </h3>

        <ul id="taskList"></ul>

    </div>

    <footer>
        <p>Created by Ravi Tejas | Week 5 JavaScript Project
              | © 2026 Ravi Tejas. All rights reserved.
        </p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
